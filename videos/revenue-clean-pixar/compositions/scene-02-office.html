<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          font-family: "Sora", sans-serif;
          background: #0E1016;
        }
        .shot {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
        }
        .shot-cam {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          transform-origin: 50% 42%;
        }
        .shot-media {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }
        .cinematic-vignette {
          position: absolute;
          inset: 0;
          background: radial-gradient(circle at 50% 44%, rgba(0,0,0,0) 54%, rgba(8,10,15,0.48) 100%);
          pointer-events: none;
        }
        
      .warm-sunset-wash {
        position: absolute;
        inset: 0;
        background: linear-gradient(125deg, rgba(255,190,115,0.16) 0%, rgba(255,190,115,0) 60%);
        pointer-events: none;
        z-index: 8;
      }
      .chat-overlay-card {
        position: absolute;
        left: 72px;
        top: 1090px;
        width: 560px;
        padding: 24px 26px;
        border-radius: 26px;
        background: rgba(18, 22, 31, 0.88);
        border: 2px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 22px 48px rgba(0, 0, 0, 0.48);
        z-index: 22;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .chat-header {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 800;
        color: #D4E6D6;
        padding-bottom: 10px;
        border-bottom: 1.5px solid rgba(255,255,255,0.12);
      }
      .chat-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #9EB8A0;
      }
      .bubble-in {
        align-self: flex-start;
        background: #FFFFFF;
        color: #14171F;
        padding: 14px 22px;
        border-radius: 18px 18px 18px 4px;
        font-size: 30px;
        font-weight: 700;
      }
      .bubble-row-out {
        position: relative;
        align-self: flex-end;
        min-height: 62px;
      }
      .bubble-draft {
        position: relative;
        background: #DCF8C6;
        color: #14171F;
        padding: 14px 24px;
        border-radius: 18px 18px 4px 18px;
        font-size: 30px;
        font-weight: 700;
      }
      .draft-strike {
        position: absolute;
        left: 16px;
        right: 16px;
        top: 50%;
        height: 5px;
        background: #EF4444;
        border-radius: 4px;
        transform-origin: left center;
      }
      .bubble-final {
        position: absolute;
        right: 0;
        top: 0;
        white-space: nowrap;
        background: #2C3446;
        color: #FFFFFF;
        border: 1.5px solid rgba(255,255,255,0.22);

      tl.set("#s2-glass", { opacity: 1 }, 7.3);
      tl.set("#s2-ots", { opacity: 0 }, 7.3);
