<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Vista Rumo WhatsApp Simulation</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background-color: #efeae2;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      position: relative;
    }

    #app-container {
      width: 1080px;
      height: 1920px;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      background-color: #efeae2;
    }

    #chat-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background-color: #efeae2;
      background-image: url('assets/whatsapp_bg.png');
      background-repeat: repeat;
      background-size: 540px auto;
      opacity: 1;
      z-index: 1;
      pointer-events: none;
    }

    /* iOS Status Bar */
    #status-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 96px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 50px 0 50px;
      color: #000000;
      background: #ffffff;
    }
    .status-time {
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.4px;
      color: #000000;
    }
    .dynamic-island {
      width: 250px;
      height: 56px;
      background: #000000;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 20px;
    }
    .dynamic-camera {
      width: 20px;
      height: 20px;
      background: #111e2e;
      border-radius: 50%;
      border: 1px solid #1a2c42;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 24px;
    }
    .bar {
      width: 5px;
      background: #000000;
      border-radius: 1.5px;
    }
    .bar-1 { height: 8px; }
    .bar-2 { height: 13px; }
    .bar-3 { height: 18px; }
    .bar-4 { height: 24px; }
    .status-5g {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-left: 4px;
      color: #000000;
    }
    .battery-icon {
      width: 48px;
      height: 24px;
      border: 3px solid #000000;
      border-radius: 6px;
      padding: 2px;
      position: relative;
      display: flex;
      align-items: center;
    }
    .battery-icon::after {
      content: '';
      position: absolute;
      right: -6px;
      width: 3px;
      height: 10px;
      background: #000000;
      border-radius: 0 2px 2px 0;
    }
    .battery-fill {
      width: 85%;
      height: 100%;
      background: #000000;
      border-radius: 2px;
    }

    /* WhatsApp Header */
    #header {
      position: absolute;
      top: 96px;
      left: 0;
      width: 1080px;
      height: 124px;
      background: #ffffff;
      border-bottom: 1px solid #e9edef;
      z-index: 99;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .back-btn {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111b21;
    }
    .header-avatar {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      overflow: hidden;
      background: #000000;
      flex-shrink: 0;
    }
    .header-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .header-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .contact-name {
      font-size: 34px;
      font-weight: 700;
      color: #111b21;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .contact-status {
      font-size: 24px;
      color: #8696a0;
      font-weight: 400;
      margin-top: 2px;
    }
    .contact-status.typing {
      color: #00a884;
      font-weight: 500;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .header-action-icon {
      color: #111b21;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Chat Messages Container */
    #chat-scroll-area {
      position: absolute;
      top: 220px;
      bottom: 140px;
      left: 0;
      width: 1080px;
      overflow: hidden;
      z-index: 10;
      padding: 16px 36px 20px 36px;
    }
    #messages-viewport {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      width: 100%;
      transform: translateY(0);
      will-change: transform;
    }
    #messages-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .date-pill {
      align-self: center;
      background: #ffffff;
      padding: 8px 24px;
      border-radius: 18px;
      font-size: 22px;
      font-weight: 500;
      color: #54656f;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
      margin: 8px 0 16px 0;
    }

    .message-row {
      display: flex;
      width: 100%;
    }
    .message-row.received {
      justify-content: flex-start;
    }
    .message-row.sent {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 820px;
      padding: 14px 22px 12px 22px;
      font-size: 32px;
      line-height: 1.36;
      letter-spacing: -0.2px;
      position: relative;
      word-wrap: break-word;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
      opacity: 1 !important;
    }

    .message-row.sent .bubble {
      background-color: #d9fdd3 !important;
      color: #111b21 !important;
      border-radius: 18px 18px 4px 18px;
    }
    .message-row.sent .bubble::after {
      content: "";
      position: absolute;
      right: -8px;
      bottom: 0;
      width: 14px;
      height: 18px;
      background: radial-gradient(circle at 100% 0, transparent 14px, #d9fdd3 15px);
    }

    .message-row.received .bubble {
      background-color: #ffffff !important;
      color: #111b21 !important;
      border-radius: 18px 18px 18px 4px;
    }
    .message-row.received .bubble::before {
      content: "";
      position: absolute;
      left: -8px;
      bottom: 0;
      width: 14px;
      height: 18px;
      background: radial-gradient(circle at 0 0, transparent 14px, #ffffff 15px);
    }

    .msg-content {
      display: inline;
      color: #111b21 !important;
      font-weight: 450;
    }
    .msg-meta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      float: right;
      margin-left: 20px;
      margin-top: 10px;
      font-size: 22px;
      color: #667781 !important;
      font-variant-numeric: tabular-nums;
    }
    .checkmarks {
      color: #53bdeb !important;
      font-size: 20px;
      font-weight: 700;
      margin-left: 2px;
    }

    /* Deterministic Typing Bubble Indicator (driven by t in JS) */
    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 24px;
      background-color: #ffffff !important;
      border-radius: 18px 18px 18px 4px;
      box-shadow: 0 1px 0.5px rgba(11, 20, 26, 0.13);
      width: fit-content;
      position: relative;
    }
    .typing-bubble::before {
      content: "";
      position: absolute;
      left: -8px;
      bottom: 0;
      width: 14px;
      height: 18px;
      background: radial-gradient(circle at 0 0, transparent 14px, #ffffff 15px);
    }
    .dot {
      width: 12px;
      height: 12px;
      background: #8e8e93;
      border-radius: 50%;
      transform: scale(0.6);
      opacity: 0.4;
    }

    /* Bottom Input Bar */
    #bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1080px;
      height: 140px;
      background: #f0f2f5;
      border-top: 1px solid #e9edef;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 24px 20px 24px;
      gap: 16px;
    }
    .input-plus {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .input-box {
      flex: 1;
      height: 72px;
      background: #ffffff;
      border: 1px solid #d1d7db;
      border-radius: 36px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      font-size: 30px;
      color: #111b21;
      position: relative;
      overflow: hidden;
    }
    .input-placeholder {
      color: #8696a0;
      position: absolute;
      left: 24px;
    }
    .input-text {
      color: #111b21;
      white-space: nowrap;
      overflow: hidden;
      direction: ltr;
      font-weight: 450;
    }
    .input-cursor {
      display: inline-block;
      width: 3px;
      height: 36px;
      background: #00a884;
      margin-left: 2px;
      vertical-align: middle;
    }
    .input-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .default-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .action-icon {
      cursor: pointer;
    }
    .send-btn-circle {
      width: 68px;
      height: 68px;
      background: #00a884;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 168, 132, 0.35);
    }

    #home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 8px;
      background: #000000;
      border-radius: 4px;
      z-index: 101;
    }

    #outro-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      background: #000000;
      z-index: 500;
      display: none;
      overflow: hidden;
    }
    .outro-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      display: none;
    }
  </style>
</head>

  <script>
    const SCRIPT = [
      { id: 1, sender: "client", text: "Oi, Vista Rumo! 👀", typeStart: 0.4, sendTime: 1.4, timeStr: "9:41 AM" },
      { id: 2, sender: "vr", text: "Fala, xerife!", typingStart: 1.9, sendTime: 2.8, timeStr: "9:41 AM" },
      { id: 3, sender: "client", text: "Me tira uma dúvida... Vai ter Black Friday mesmo ou vocês vão deixar a gente na vontade? 😂", typeStart: 3.4, sendTime: 5.8, timeStr: "9:41 AM" },
      { id: 4, sender: "vr", text: "KKKKK calma! A gente está preparando uma coisa especial...", typingStart: 6.5, sendTime: 8.2, timeStr: "9:42 AM" },
      { id: 5, sender: "client", text: "Especial quanto? 👀", typeStart: 8.9, sendTime: 10.2, timeStr: "9:42 AM" },
      { id: 6, sender: "vr", text: "Digamos que você não vai querer perder. Começa dia 13/11, às 10:00! 🔥", typingStart: 10.8, sendTime: 12.8, timeStr: "9:43 AM" },
      { id: 7, sender: "client", text: "E vai ter desconto de verdade ou aquele descontinho de sempre? 🤨", typeStart: 13.5, sendTime: 15.6, timeStr: "9:43 AM" },
      { id: 8, sender: "vr", text: "🔥 As Oversized vão ficar por R$ 79,90.", typingStart: 16.3, sendTime: 17.6, timeStr: "9:44 AM" },
      { id: 9, sender: "vr", text: "🔥 As UV vão ficar por R$ 103,90.", typingStart: 17.9, sendTime: 18.9, timeStr: "9:44 AM" },
      { id: 10, sender: "vr", text: "E tem mais: Em compras acima de R$ 199,00 o frete é grátis para a região Nordeste.", typingStart: 19.3, sendTime: 21.0, timeStr: "9:44 AM" },
      { id: 11, sender: "client", text: "Pera... TUDO ISSO??? Manda logo esse link antes que eu esqueça 😂", typeStart: 21.8, sendTime: 24.0, timeStr: "9:44 AM" },
      { id: 12, sender: "vr", text: "Já deixa salvo: 🌐 vistarumo.com.br", typingStart: 24.6, sendTime: 25.8, timeStr: "9:45 AM" },
      { id: 13, sender: "vr", text: "Mas ó... fica de olho, porque é por tempo limitado!", typingStart: 26.1, sendTime: 27.4, timeStr: "9:45 AM" },
      { id: 14, sender: "client", text: "Agora sim! Vou garantir a minha. 🔥", typeStart: 28.0, sendTime: 29.5, timeStr: "9:45 AM" }
    ];

    const OUTRO_START = 30.2;
    const DURATION = 36.0;
    const ROW_GAP = 14;

    const messagesListEl = document.getElementById('messages-list');
    const messagesViewportEl = document.getElementById('messages-viewport');
    const contactStatusEl = document.getElementById('contact-status');
    const inputPlaceholderEl = document.getElementById('input-placeholder');
    const inputTextEl = document.getElementById('input-text');
    const inputCursorEl = document.getElementById('input-cursor');
    const defaultActionsEl = document.getElementById('default-actions');
    const sendBtnEl = document.getElementById('send-btn');
    const outroOverlayEl = document.getElementById('outro-overlay');
    const outroImg1El = document.getElementById('outro-img-1');
    const outroImg2El = document.getElementById('outro-img-2');
    const chatScrollAreaEl = document.getElementById('chat-scroll-area');

    // Build message nodes safely with textContent (no raw HTML injection)
    const messageElements = SCRIPT.map((item) => {
      const row = document.createElement('div');
      const isSent = item.sender === 'client';
      row.className = `message-row ${isSent ? 'sent' : 'received'}`;
      row.style.display = 'none';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const contentSpan = document.createElement('span');
      contentSpan.className = 'msg-content';
      contentSpan.textContent = item.text;

      const metaSpan = document.createElement('span');
      metaSpan.className = 'msg-meta';
      metaSpan.textContent = item.timeStr + ' ';

      if (isSent) {
        const checksSpan = document.createElement('span');
        checksSpan.className = 'checkmarks';
        checksSpan.textContent = '✓✓';
        metaSpan.appendChild(checksSpan);
      }

      bubble.appendChild(contentSpan);
      bubble.appendChild(metaSpan);
      row.appendChild(bubble);
      messagesListEl.appendChild(row);
      return { item, row };
    });

    // Create VR typing indicator row ONCE and place it in DOM before computing milestones
    const vrTypingRow = document.createElement('div');
    vrTypingRow.className = 'message-row received';
    vrTypingRow.style.display = 'none';
    const typingBubble = document.createElement('div');
    typingBubble.className = 'typing-bubble';
    const dotEls = [0, 1, 2].map(() => {
      const dot = document.createElement('div');
      dot.className = 'dot';
      typingBubble.appendChild(dot);
      return dot;
    });
    vrTypingRow.appendChild(typingBubble);
    messagesListEl.appendChild(vrTypingRow);

    let scrollMilestones = [];
    let typingRowHeight = 0;
    let availableScrollHeight = 0;

    function computeScrollMilestones() {
      messageElements.forEach((m) => { m.row.style.display = 'flex'; });
      vrTypingRow.style.display = 'flex';

      availableScrollHeight = chatScrollAreaEl.clientHeight - 40;
      typingRowHeight = vrTypingRow.offsetHeight;

      scrollMilestones = SCRIPT.map((item, idx) => {
        const rowBottom = messageElements[idx].row.offsetTop + messageElements[idx].row.offsetHeight;
        const targetOffset = Math.max(0, rowBottom - availableScrollHeight);
        return {
          id: item.id,
          sendTime: item.sendTime,
          rowBottom,
          targetOffset
        };
      });

      messageElements.forEach((m) => { m.row.style.display = 'none'; });
      vrTypingRow.style.display = 'none';
    }

    computeScrollMilestones();

    let currentTypingAnchorIdx = null;
    let lastRenderedState = {
      visibleMessages: 0,
      vrTyping: false,
      contactStatus: 'online',
      inputText: '',
      cursorVisible: false,
      scrollOffset: 0,
      outroVisible: false,
      outroImg1Visible: false,
      outroImg2Visible: false
    };

    function easeOutCubic(p) {
      const clamped = Math.max(0, Math.min(1, p));
      return 1 - Math.pow(1 - clamped, 3);
    }

    function updateDeterministicTypingDots(t) {
      const period = 1.4;
      const offsets = [-0.32, -0.16, 0];
      dotEls.forEach((dot, idx) => {
        const phase = ((((t - offsets[idx]) % period) + period) % period) / period;
        let pulse = 0;
        if (phase < 0.4) {
          pulse = Math.sin((phase / 0.4) * Math.PI);
        }
        const scale = 0.6 + 0.5 * pulse;
        const opacity = 0.4 + 0.6 * pulse;
        dot.style.transform = `scale(${scale.toFixed(3)})`;
        dot.style.opacity = opacity.toFixed(3);
      });
    }

    function updateViewAtTime(t) {
      let lastVisibleIndex = -1;
      for (let i = 0; i < messageElements.length; i++) {
        if (t >= messageElements[i].item.sendTime) {
          messageElements[i].row.style.display = 'flex';
          lastVisibleIndex = i;
        } else {
          messageElements[i].row.style.display = 'none';
        }
      }

      // Check VR Typing Indicator
      let activeVRItem = null;
      for (let i = 0; i < SCRIPT.length; i++) {
        const item = SCRIPT[i];
        if (item.sender === 'vr' && t >= item.typingStart && t < item.sendTime) {
          activeVRItem = item;
          break;
        }
      }

      const isVRTyping = activeVRItem !== null;
      if (isVRTyping) {
        if (currentTypingAnchorIdx !== lastVisibleIndex) {
          if (lastVisibleIndex >= 0) {
            messageElements[lastVisibleIndex].row.after(vrTypingRow);
          } else {
            messagesListEl.prepend(vrTypingRow);
          }
          currentTypingAnchorIdx = lastVisibleIndex;
        }
        vrTypingRow.style.display = 'flex';
        updateDeterministicTypingDots(t);
        contactStatusEl.textContent = "digitando...";
        contactStatusEl.classList.add("typing");
      } else {
        vrTypingRow.style.display = 'none';
        contactStatusEl.textContent = "online";
        contactStatusEl.classList.remove("typing");
      }

      // Bottom Input Bar & Deterministic Client Typing + Cursor
      let activeClientTyping = null;
      let activeTypeStart = 0;
      for (let i = 0; i < SCRIPT.length; i++) {
        const item = SCRIPT[i];
        if (item.sender === 'client' && t >= item.typeStart && t < item.sendTime) {
          const progress = Math.min(1, (t - item.typeStart) / (item.sendTime - item.typeStart));
          const charCount = Math.floor(progress * item.text.length);
          activeClientTyping = item.text.substring(0, charCount);
          activeTypeStart = item.typeStart;
          break;
        }
      }

      let cursorVisible = false;
      if (activeClientTyping !== null) {
        inputPlaceholderEl.style.display = "none";
        inputTextEl.textContent = activeClientTyping;
        const blinkPhase = (((t - activeTypeStart) % 1.0) + 1.0) % 1.0;
        cursorVisible = blinkPhase < 0.5;
        inputCursorEl.style.display = "inline-block";
        inputCursorEl.style.opacity = cursorVisible ? "1" : "0";
        defaultActionsEl.style.display = "none";
        sendBtnEl.style.display = "flex";
      } else {
        inputPlaceholderEl.style.display = "block";
        inputTextEl.textContent = "";
        inputCursorEl.style.display = "none";
        defaultActionsEl.style.display = "flex";
        sendBtnEl.style.display = "none";
      }

      // Smooth deterministic scrolling (messages + typing bubble)
      let currentOffset = 0;
      if (lastVisibleIndex >= 0) {
        const currentMilestone = scrollMilestones[lastVisibleIndex];
        const prevOffset = lastVisibleIndex > 0 ? scrollMilestones[lastVisibleIndex - 1].targetOffset : 0;
        const targetOffset = currentMilestone.targetOffset;

        if (targetOffset > prevOffset) {
          const scrollProgress = (t - currentMilestone.sendTime) / 0.35;
          currentOffset = prevOffset + (targetOffset - prevOffset) * easeOutCubic(scrollProgress);
        } else {
          currentOffset = targetOffset;
        }

        if (isVRTyping) {
          const typingBottom = currentMilestone.rowBottom + ROW_GAP + typingRowHeight;
          const typingTargetOffset = Math.max(currentOffset, typingBottom - availableScrollHeight);
          if (typingTargetOffset > currentOffset) {
            const typingScrollProgress = (t - activeVRItem.typingStart) / 0.28;
            currentOffset = currentOffset + (typingTargetOffset - currentOffset) * easeOutCubic(typingScrollProgress);
          }
        }
      }

      const roundedOffset = Math.round(currentOffset);
      messagesViewportEl.style.transform = `translateY(-${roundedOffset}px)`;

      // Outro full-screen frames
      const outroVisible = t >= OUTRO_START;
      let outroImg1Visible = false;
      let outroImg2Visible = false;
      if (outroVisible) {
        outroOverlayEl.style.display = 'block';
        if (t < 33.1) {
          outroImg1El.style.display = 'block';
          outroImg2El.style.display = 'none';
          outroImg1Visible = true;
        } else {
          outroImg1El.style.display = 'none';
          outroImg2El.style.display = 'block';
          outroImg2Visible = true;
        }
      } else {
        outroOverlayEl.style.display = 'none';
        outroImg1El.style.display = 'none';
        outroImg2El.style.display = 'none';
      }

      lastRenderedState = {
        visibleMessages: lastVisibleIndex + 1,
        vrTyping: isVRTyping,
        contactStatus: contactStatusEl.textContent,
        inputText: activeClientTyping || '',
        cursorVisible,
        scrollOffset: roundedOffset,
        outroVisible,
        outroImg1Visible,
        outroImg2Visible
      };
    }

    // Deterministic interface for Puppeteer and HyperFrames seek adapter
    window.chatTimeline = {
      currentTime: 0,
      duration: DURATION,
      renderFrame: function(t) {
        this.currentTime = Math.max(0, Math.min(DURATION, Number(t) || 0));
        updateViewAtTime(this.currentTime);
      },
      getState: function() {
        return Object.assign({}, lastRenderedState);
      }
    };

    window.__timelines = window.__timelines || {};
    window.__timelines["whatsapp-reels"] = {
      duration: function() { return DURATION; },
      time: function(t) {
        if (arguments.length === 0) return window.chatTimeline.currentTime;
        window.chatTimeline.renderFrame(t);
        return this;
      },
      seek: function(t) {
        window.chatTimeline.renderFrame(t);
        return this;
      },
      pause: function() { return this; },
      paused: function() { return true; }
    };

    updateViewAtTime(0);
  </script>
</body>
</html>
